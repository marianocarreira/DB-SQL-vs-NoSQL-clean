# Copy to benchmark.local.properties (ignored), or keep it outside this repository.
# Supply fresh limited credentials, not the recovered historical values.
benchmark.profile=local
benchmark.targetConfirmed=
benchmark.allowWrites=false
benchmark.writeRows=1000
benchmark.threads=1
benchmark.loops=2
benchmark.rampSeconds=1

# TLS defaults on, with server certificate validation.
sql.url=jdbc:sqlserver://localhost:1433;databaseName=benchmark_lab;encrypt=true;trustServerCertificate=false;
sql.username=benchmark_user
sql.password=

mongo.host=localhost
mongo.port=27017
mongo.database=benchmark_lab
mongo.authDatabase=benchmark_lab
mongo.collection=Posts
mongo.username=benchmark_user
mongo.password=
mongo.tls=true
